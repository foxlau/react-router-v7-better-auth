name: 🔍 PR Code Validation

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: 🧹 Oxc lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint

  typecheck:
    needs: lint
    name: 🔎 Type check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: ⚙️ Prepare Wrangler config
        run: cp -f wrangler.jsonc.example wrangler.jsonc

      - name: 📎 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔐 Dependency security audit
        run: bun audit

      # typecheck runs typegen (cf-typegen + react-router typegen) then tsc — see package.json
      - name: 📝 Typegen + typecheck
        run: bun run typecheck

      - name: 🧪 Vitest regression tests
        run: bun run test

      - name: 🏗️ Production build
        run: bun run build
