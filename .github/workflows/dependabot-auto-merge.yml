name: 🤖 Dependabot auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # This privileged workflow must never check out or execute PR code.
      - name: Fetch verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Select eligible updates
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
        run: |
          if [[ "$MAINTAINER_CHANGES" != "true" &&
                ( "$UPDATE_TYPE" == "version-update:semver-patch" ||
                  "$UPDATE_TYPE" == "version-update:semver-minor" ) ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable squash auto-merge after required checks pass
        if: steps.policy.outputs.eligible == 'true'
        run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD_SHA"

      - name: Keep major or maintainer-changing updates manual
        if: steps.policy.outputs.eligible != 'true'
        run: |
          if [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "$PR_URL" --disable-auto
          fi
