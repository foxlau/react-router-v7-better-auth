# Format and lint staged files; CI also checks types, tests, and the build.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yml,yaml}'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: bunx oxlint --deny-warnings --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
